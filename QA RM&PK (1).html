<title>QA RM&amp;PK</title>
<style>
:root{--bg:#f3f5fb;--fg:#12162b;--muted:#6a7090;--card:rgba(255,255,255,.66);--card2:rgba(255,255,255,.36);--line:rgba(20,24,60,.09);--hi:rgba(255,255,255,.95);--sh:rgba(30,40,100,.22);--solid:rgba(255,255,255,.93);--a:#3b82f6;--b:#8b5cf6;--c:#f472b6;--bl:.5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070912;--fg:#eef0ff;--muted:#8d93b6;--card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.025);--line:rgba(255,255,255,.1);--hi:rgba(255,255,255,.2);--sh:rgba(0,0,0,.65);--solid:rgba(24,27,44,.94);--a:#38bdf8;--b:#8b7bff;--bl:.38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070912;--fg:#eef0ff;--muted:#8d93b6;--card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.025);--line:rgba(255,255,255,.1);--hi:rgba(255,255,255,.2);--sh:rgba(0,0,0,.65);--solid:rgba(24,27,44,.94);--a:#38bdf8;--b:#8b7bff;--bl:.38;color-scheme:dark}
:root[data-gold]{--a:#ffc94d;--b:#f59e0b;--c:#fb7185}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Prompt","Sukhumvit Set","Noto Sans Thai",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bl{position:absolute;width:72vmax;height:72vmax;border-radius:50%;opacity:var(--bl);animation:dr 26s ease-in-out infinite alternate;transition:opacity .6s}
.b1{left:-28vmax;top:-34vmax;background:radial-gradient(circle,var(--a),transparent 62%);translate:calc(var(--gx,0)*14px) calc(var(--gy,0)*10px)}
.b2{right:-34vmax;top:12vh;background:radial-gradient(circle,var(--b),transparent 62%);animation-delay:-9s;translate:calc(var(--gx,0)*-18px) calc(var(--gy,0)*12px)}
.b3{left:0;bottom:-46vmax;background:radial-gradient(circle,var(--c),transparent 62%);animation-delay:-17s;translate:calc(var(--gx,0)*10px) calc(var(--gy,0)*-14px)}
@keyframes dr{to{transform:translate(6vmax,4vmax) scale(1.12)}}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:24px 18px 56px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 4px 0}
.cap{font-size:13px;color:var(--muted);margin-bottom:2px}
h1{margin:0;font-size:clamp(32px,9.5vw,40px);line-height:1.15;font-weight:800;letter-spacing:.01em;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.mode{flex:none;width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--line);background:linear-gradient(160deg,var(--card),var(--card2));color:var(--fg);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 var(--hi);-webkit-tap-highlight-color:transparent}
.mode svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.panel,.glass,.search{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);box-shadow:0 22px 44px -26px var(--sh),inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.panel{position:relative;overflow:hidden;margin:18px 0 18px;padding:24px 16px 18px;border-radius:30px;text-align:center;transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .7s cubic-bezier(.2,.9,.2,1)}
.panel.hot{transition:transform .15s linear}
.panel::before,.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.26),transparent 55%);opacity:.5;transition:opacity .3s}
.sc{display:flex;align-items:baseline;justify-content:center;font-size:clamp(54px,17vw,76px);font-weight:300;line-height:1;letter-spacing:-.02em}
.sl{display:flex}
.sl:last-child{font-size:.34em;font-weight:600;color:var(--a);margin-left:.6em}
.sc>i:nth-child(4){display:none}
.d{display:block;width:.6em;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(120,150,255,.35);text-shadow:0 0 40px color-mix(in srgb,var(--a) 45%,transparent)}
.sl:last-child .d{text-shadow:none}
.d.f{animation:roll .45s cubic-bezier(.2,.8,.2,1)}
@keyframes roll{from{opacity:.1;transform:translateY(-.14em)}}
.sep{font-style:normal;font-weight:300;color:var(--a);margin:0 .02em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.gr{margin-top:14px;font-size:20px;font-weight:700;line-height:1.35}
.panel p{margin:4px 8px 0;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card),var(--card2));font-size:12.5px;font-weight:600}
.chip.gold{border-color:var(--a);border-color:color-mix(in srgb,var(--a) 70%,transparent);box-shadow:0 0 20px -6px var(--a)}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:99px;color:var(--muted)}
.search svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font:inherit;font-size:16px}
.sec{display:flex;align-items:center;gap:10px;margin:28px 6px 12px;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:144px;padding:16px;border-radius:24px;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .7s cubic-bezier(.2,.9,.2,1);animation:in .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms)}
.card.hot{--ty:-3px;transition:transform .15s linear}
.card:active{transform:perspective(900px) scale(.97)}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}}
.glass{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.glass::before{opacity:0}
.hot .glass::before{opacity:1}
.glass::after{content:"";position:absolute;left:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--c1);filter:blur(36px);opacity:.3}
.row{display:flex;justify-content:space-between;align-items:flex-start;transform-style:preserve-3d}
.ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 20px -8px var(--c2);transform:translateZ(22px)}
.ico svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.go{width:18px;height:18px;margin:2px 2px 0 0;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6;transition:transform .3s,opacity .3s}
.hot .go{opacity:1;transform:translate(2px,-2px)}
.txt{transform:translateZ(12px)}
.lbl{display:block;font-size:16px;font-weight:600;line-height:1.25;word-break:break-word}
.tag{display:inline-block;margin-top:7px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font:600 9.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;color:var(--muted)}
.tag.lan{color:#fff;background:#ff453a;border-color:transparent}
.empty{display:none;margin:40px 0;text-align:center;color:var(--muted)}
.note{margin:26px 0 0;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100dvh}
.wrap{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.mode{width:44px;height:44px}
.card,.mode,.chip{touch-action:manipulation}
.card:focus-visible,.mode:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.sc{font-size:clamp(46px,min(17vw,13vh),76px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.panel,.glass,.search,.mode,.chip{background:var(--solid)}}
@media (max-width:359px){

}

@media (min-width:760px){

  .side{position:sticky;top:max(24px,env(safe-area-inset-top))}
  .main{padding-top:14px}
  h1{font-size:44px}
}
@media (min-width:760px) and (max-height:700px){.side{position:static}}
@media (min-width:1200px){.card{min-height:156px}}
@media (min-width:1600px){.wrap{max-width:1320px}}
@media (max-height:520px) and (orientation:landscape){
  .wrap{padding-top:14px;padding-bottom:24px}
  .panel{margin:10px 0;padding:14px 12px 12px}.gr{margin-top:8px;font-size:17px}.chips{margin-top:8px}
  .sc{font-size:clamp(40px,min(14vw,15vh),64px)}
}
</style>
